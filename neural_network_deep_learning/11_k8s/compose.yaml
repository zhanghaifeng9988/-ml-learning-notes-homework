
services:
  tf-serving:
    image: clothing-serving:v1
    # restart: "no"  
    ports:
      - "8500:8500" 
      - "8501:8501"
    #volumes:
    #  - ./clothing_model:/models/clothing_model/1
    environment:
      - MODEL_NAME=clothing_model

  gateway:
    image: clothing_gateway:v1_k8s
    # restart: "no"
    ports:
      - "9696:9696"
    environment:
      - TF_SERVING_HOST=tf-serving:8500
    depends_on:
      - tf-serving