
services:
  tf-serving:
    image: docker.m.daocloud.io/tensorflow/serving:2.13.1
    # restart: "no"  
    ports:
      - "8500:8500" 
      - "8501:8501"
    volumes:
      - ./clothing_model:/models/clothing_model/1
    environment:
      - MODEL_NAME=clothing_model

  gateway:
    image: clothing_gateway:latest
    # restart: "no"
    ports:
      - "9696:9696"
    environment:
      - TF_SERVING_HOST=tf-serving:8500
    depends_on:
      - tf-serving